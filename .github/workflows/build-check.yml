name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare build environment
        run: |
          echo "===== CHECKING PROJECT STRUCTURE ====="
          find . -maxdepth 5 -type f | sort

          echo "===== CREATING MISSING FILES ====="
          # Nếu thiếu thư mục assets, tạo nó
          mkdir -p app/src/main/assets
          # Nếu thiếu model.tflite, tạo file rỗng để không bị lỗi
          if [ ! -f app/src/main/assets/model.tflite ]; then
            echo "Creating dummy model.tflite"
            touch app/src/main/assets/model.tflite
          fi

          echo "===== GRADLE VERSION ====="
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/**/*.apk'
